aid: allen-control-systems
name: Allen Control Systems
description: 'Allen Control Systems is a defense technology company building autonomous
  precision weapon stations that detect, track, and neutralize unmanned aerial systems
  (drones) for military and partner forces. Its Bullfrog family of robotic gun mounts
  (M240C, M2, M230, M134) pairs passive machine-vision drone detection with autonomous
  fire-control targeting, synthetic training-data generation, and low-collateral engagement
  options such as laser dazzlers and composite rounds. The systems use an open architecture
  to integrate with command-and-control platforms. Backed by Craft Ventures, the company
  is tracked in the API Evangelist network as a defense-sector provider; it publishes
  no public developer API, portal, or specification at this time.'
